[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balatro4llm"
version = "0.5.0"
description = "Lua Mod + CLI (+ future MCP) bridge for AI Agents to play Balatro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
balatro-cli = "balatro4llm.cli:main"

[tool.setuptools.packages.find]
include = ["balatro4llm*"]
